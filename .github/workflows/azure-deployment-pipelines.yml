name: Deployment pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: financial-data-agent

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: Pyrefly type check
        if: ${{ !cancelled() }}
        run: uv run pyrefly check

      - name: Pytest
        if: ${{ !cancelled() }}
        run: uv run pytest

  deploy-iac-test:
    name: Deploy iac (test)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: deploy-iac-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: iac/environments/test
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: "true"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_VAR_supabase_db_password: ${{ secrets.SUPABASE_DB_PASSWORD }}
    outputs:
      resource_group: ${{ steps.tf.outputs.resource_group }}
      registry: ${{ steps.tf.outputs.registry }}
      login_server: ${{ steps.tf.outputs.login_server }}
      app: ${{ steps.tf.outputs.app }}
      fqdn: ${{ steps.tf.outputs.fqdn }}
      supabase_project_ref: ${{ steps.tf.outputs.supabase_project_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Capture Terraform outputs
        id: tf
        run: |
          echo "resource_group=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "registry=$(terraform output -raw container_registry_name)" >> "$GITHUB_OUTPUT"
          echo "login_server=$(terraform output -raw container_registry_login_server)" >> "$GITHUB_OUTPUT"
          echo "app=$(terraform output -raw container_app_name)" >> "$GITHUB_OUTPUT"
          echo "fqdn=$(terraform output -raw container_app_fqdn)" >> "$GITHUB_OUTPUT"
          echo "supabase_project_ref=$(terraform output -raw supabase_project_ref)" >> "$GITHUB_OUTPUT"

  migrate-db-test:
    name: Migrate database (test)
    needs: deploy-iac-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: migrate-db-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # terraform_wrapper is off because the wrapper publishes Terraform's stdout as
      # an unmasked step output, which would expose the connection string.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Read from state rather than a job output, which would not be masked either.
      - name: Read database URL from Terraform state
        working-directory: iac/environments/test
        run: |
          terraform init -input=false
          url="$(terraform output -raw database_url)"
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # migrations/env.py requires DATABASE_URL. Its load_dotenv() call finds no
      # .env here, since .env is gitignored, so the value above is the only source.
      - name: Alembic upgrade head
        working-directory: src/financial_data_agent
        run: uv run alembic upgrade head

  deploy-app-test:
    name: Deploy app (test)
    needs: [deploy-iac-test, migrate-db-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: deploy-app-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        run: az acr login --name "${{ needs.deploy-iac-test.outputs.registry }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ needs.deploy-iac-test.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ needs.deploy-iac-test.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy image to container app
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "${{ needs.deploy-iac-test.outputs.app }}" \
            --resource-group "${{ needs.deploy-iac-test.outputs.resource_group }}" \
            --image "${{ needs.deploy-iac-test.outputs.login_server }}/$IMAGE_NAME:${{ github.sha }}"

      - name: Smoke check
        run: >
          curl --fail --silent --show-error
          --retry 10 --retry-all-errors --retry-delay 15
          "https://${{ needs.deploy-iac-test.outputs.fqdn }}/api/v1/cow"

  deploy-iac-prod:
    name: Deploy iac (prod)
    needs: deploy-iac-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-iac-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: iac/environments/prod
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: "true"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_VAR_supabase_db_password: ${{ secrets.SUPABASE_DB_PASSWORD }}
    outputs:
      resource_group: ${{ steps.tf.outputs.resource_group }}
      registry: ${{ steps.tf.outputs.registry }}
      login_server: ${{ steps.tf.outputs.login_server }}
      app: ${{ steps.tf.outputs.app }}
      fqdn: ${{ steps.tf.outputs.fqdn }}
      supabase_project_ref: ${{ steps.tf.outputs.supabase_project_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Capture Terraform outputs
        id: tf
        run: |
          echo "resource_group=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "registry=$(terraform output -raw container_registry_name)" >> "$GITHUB_OUTPUT"
          echo "login_server=$(terraform output -raw container_registry_login_server)" >> "$GITHUB_OUTPUT"
          echo "app=$(terraform output -raw container_app_name)" >> "$GITHUB_OUTPUT"
          echo "fqdn=$(terraform output -raw container_app_fqdn)" >> "$GITHUB_OUTPUT"
          echo "supabase_project_ref=$(terraform output -raw supabase_project_ref)" >> "$GITHUB_OUTPUT"

  migrate-db-prod:
    name: Migrate database (prod)
    needs: deploy-iac-prod
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: migrate-db-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # terraform_wrapper is off because the wrapper publishes Terraform's stdout as
      # an unmasked step output, which would expose the connection string.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Read from state rather than a job output, which would not be masked either.
      - name: Read database URL from Terraform state
        working-directory: iac/environments/prod
        run: |
          terraform init -input=false
          url="$(terraform output -raw database_url)"
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # migrations/env.py requires DATABASE_URL. Its load_dotenv() call finds no
      # .env here, since .env is gitignored, so the value above is the only source.
      - name: Alembic upgrade head
        working-directory: src/financial_data_agent
        run: uv run alembic upgrade head

  deploy-app-prod:
    name: Deploy app (prod)
    needs: [deploy-iac-prod, migrate-db-prod]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-app-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        run: az acr login --name "${{ needs.deploy-iac-prod.outputs.registry }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ needs.deploy-iac-prod.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ needs.deploy-iac-prod.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy image to container app
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "${{ needs.deploy-iac-prod.outputs.app }}" \
            --resource-group "${{ needs.deploy-iac-prod.outputs.resource_group }}" \
            --image "${{ needs.deploy-iac-prod.outputs.login_server }}/$IMAGE_NAME:${{ github.sha }}"

      - name: Smoke check
        run: >
          curl --fail --silent --show-error
          --retry 10 --retry-all-errors --retry-delay 15
          "https://${{ needs.deploy-iac-prod.outputs.fqdn }}/api/v1/cow"
