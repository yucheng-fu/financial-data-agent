name: Deployment pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Matches the Vercel runtime, which supports Python 3.12 and later.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: Pyrefly type check
        if: ${{ !cancelled() }}
        run: uv run pyrefly check

      - name: Pytest
        if: ${{ !cancelled() }}
        run: uv run pytest

  migrate-db-test:
    name: Migrate database (test)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: migrate-db-test
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_READER_DATABASE_URL: ${{ secrets.LLM_READER_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # migrations/env.py requires DATABASE_URL. Its load_dotenv() call finds no
      # .env here, since .env is gitignored, so the secret is the only source.
      - name: Alembic upgrade head
        working-directory: src/financial_data_agent
        run: uv run alembic upgrade head

  deploy-app-test:
    name: Deploy app (test)
    needs: migrate-db-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: deploy-app-test
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Creates the project on the first run and reuses it afterwards.
      - name: Link Vercel project
        run: vercel link --yes --project fda-test --token "$VERCEL_TOKEN"

      # Config is passed per deployment so the GitHub environment is its only source.
      - name: Deploy to Vercel
        id: deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_READER_DATABASE_URL: ${{ secrets.LLM_READER_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          FILINGS_BUCKET: ${{ vars.FILINGS_BUCKET }}
        run: |
          runtime_env=(
            --env ENVIRONMENT=test
            --env EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
            --env EMBEDDING_CACHE_DIR=/tmp/fastembed
            --env EDGAR_LOCAL_DATA_DIR=/tmp/edgar
            --env DATABASE_URL="$DATABASE_URL"
            --env LLM_READER_DATABASE_URL="$LLM_READER_DATABASE_URL"
            --env SUPABASE_URL="$SUPABASE_URL"
            --env SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY"
            --env GOOGLE_API_KEY="$GOOGLE_API_KEY"
            --env LLM_MODEL="$LLM_MODEL"
            --env FILINGS_BUCKET="$FILINGS_BUCKET"
          )
          url="$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" "${runtime_env[@]}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # vercel curl adds the deployment-protection bypass, so the new deployment's
      # own URL can be checked without knowing the production domain.
      - name: Smoke check
        run: >
          vercel curl "${{ steps.deploy.outputs.url }}/api/v1/cow" --token "$VERCEL_TOKEN"
          -- --fail --silent --show-error
          --retry 10 --retry-all-errors --retry-delay 15

  migrate-db-prod:
    name: Migrate database (prod)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: migrate-db-prod
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_READER_DATABASE_URL: ${{ secrets.LLM_READER_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # migrations/env.py requires DATABASE_URL. Its load_dotenv() call finds no
      # .env here, since .env is gitignored, so the secret is the only source.
      - name: Alembic upgrade head
        working-directory: src/financial_data_agent
        run: uv run alembic upgrade head

  deploy-app-prod:
    name: Deploy app (prod)
    needs: migrate-db-prod
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-app-prod
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Creates the project on the first run and reuses it afterwards.
      - name: Link Vercel project
        run: vercel link --yes --project fda-prod --token "$VERCEL_TOKEN"

      # Config is passed per deployment so the GitHub environment is its only source.
      - name: Deploy to Vercel
        id: deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_READER_DATABASE_URL: ${{ secrets.LLM_READER_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          FILINGS_BUCKET: ${{ vars.FILINGS_BUCKET }}
        run: |
          runtime_env=(
            --env ENVIRONMENT=prod
            --env EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
            --env EMBEDDING_CACHE_DIR=/tmp/fastembed
            --env EDGAR_LOCAL_DATA_DIR=/tmp/edgar
            --env DATABASE_URL="$DATABASE_URL"
            --env LLM_READER_DATABASE_URL="$LLM_READER_DATABASE_URL"
            --env SUPABASE_URL="$SUPABASE_URL"
            --env SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY"
            --env GOOGLE_API_KEY="$GOOGLE_API_KEY"
            --env LLM_MODEL="$LLM_MODEL"
            --env FILINGS_BUCKET="$FILINGS_BUCKET"
          )
          url="$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" "${runtime_env[@]}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # vercel curl adds the deployment-protection bypass, so the new deployment's
      # own URL can be checked without knowing the production domain.
      - name: Smoke check
        run: >
          vercel curl "${{ steps.deploy.outputs.url }}/api/v1/cow" --token "$VERCEL_TOKEN"
          -- --fail --silent --show-error
          --retry 10 --retry-all-errors --retry-delay 15
