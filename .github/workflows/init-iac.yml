name: Init IaC

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to bootstrap
        type: choice
        options:
          - test
          - prod
        required: true
      principal_id:
        description: Object ID of the service principal Terraform runs as for this environment
        type: string
        required: true

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap Azure (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: bootstrap
    concurrency:
      group: init-iac-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      PRINCIPAL_ID: ${{ inputs.principal_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register resource providers
        run: |
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.OperationalInsights --wait

      - name: Bicep what-if
        run: >
          az deployment sub what-if
          --name "bootstrap-${ENVIRONMENT}"
          --location westeurope
          --parameters "iac/bootstrap/${ENVIRONMENT}.bicepparam"

      - name: Bicep deploy
        run: >
          az deployment sub create
          --name "bootstrap-${ENVIRONMENT}"
          --location westeurope
          --parameters "iac/bootstrap/${ENVIRONMENT}.bicepparam"
