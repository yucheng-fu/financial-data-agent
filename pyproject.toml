[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ollama-rag"
version = "0.1.0"
description = "RAG tooling for Ollama"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yucheng" }]
dependencies = [
"ollama==0.6.2",
"edgartools==5.43.0",
"fastapi==0.140.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_rag"]

[tool.hatch.build.targets.sdist]
include = [
  "README.md",
  "pyproject.toml",
  "src",
]
