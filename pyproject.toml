[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ollama-rag"
version = "0.1.0"
description = "RAG tooling for Ollama"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yucheng" }]
dependencies = [
    "ollama==0.6.2",
    "edgartools==5.43.0",
    "fastapi==0.140.0",
    "polars==1.43.1",
    "requests==2.34.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.format]  
quotes = "double"
indent-size = "space"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_rag"]

[tool.hatch.build.targets.sdist]
include = [
  "README.md",
  "pyproject.toml",
  "src",
]
