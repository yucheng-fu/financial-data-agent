[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "financial-data-agent"
version = "0.1.0"
description = "Financial data agent for SEC and market data workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yucheng" }]
dependencies = [
    "edgartools==5.43.0",
    "fastapi[standard]==0.140.0",
    "python-dotenv>=1.0.1",
    "polars==1.42.1",
    "requests==2.34.2",
    "sqlalchemy>=2.0.51",
    "pydantic>=2.13.4",
    "pgvector>=0.5.0",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "azure-storage-blob>=12.24.0",
    "azure-identity>=1.19.0",
    "fastembed==0.8.1",
    "langchain-text-splitters>=1.1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pytest>=9.1.1",
    "pyrefly>=1.3.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.format]  
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
preset = "basic"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_data_agent"]

[tool.hatch.build.targets.sdist]
include = [
  "README.md",
  "pyproject.toml",
  "src",
]
